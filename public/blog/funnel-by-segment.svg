<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A four-step funnel split by platform, with desktop holding at 61 percent to the final step while mobile falls to 19 percent.">
  <!--
    BUYER: REPLACE THIS. A sample figure for the MDX image mapping, drawn rather
    than photographed so nothing licensed ships in the template.

    Colours are deliberately mid-tone hex rather than theme tokens: this file is
    loaded through <img>, so it cannot inherit currentColor or the .dark class.
    Each value sits between the light and dark palette so the figure reads on
    both backgrounds. See progress-tracker.md, feature 14.
  -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="0" y="26" font-size="26" font-weight="600" fill="#8a8a99">Checkout funnel, by platform</text>

    <!-- Desktop -->
    <text x="0" y="96" font-size="22" font-weight="500" fill="#8a8a99">Desktop</text>
    <g transform="translate(0 118)">
      <rect x="0" y="0" width="1200" height="44" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="0" width="1200" height="44" rx="8" fill="#6455f0" opacity="0.85" />
      <text x="1176" y="29" font-size="20" font-weight="600" fill="#ffffff" text-anchor="end">100%</text>
      <rect x="0" y="58" width="1200" height="44" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="58" width="1044" height="44" rx="8" fill="#6455f0" opacity="0.85" />
      <text x="1020" y="87" font-size="20" font-weight="600" fill="#ffffff" text-anchor="end">87%</text>
      <rect x="0" y="116" width="1200" height="44" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="116" width="864" height="44" rx="8" fill="#6455f0" opacity="0.85" />
      <text x="840" y="145" font-size="20" font-weight="600" fill="#ffffff" text-anchor="end">72%</text>
      <rect x="0" y="174" width="1200" height="44" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="174" width="732" height="44" rx="8" fill="#6455f0" opacity="0.85" />
      <text x="708" y="203" font-size="20" font-weight="600" fill="#ffffff" text-anchor="end">61%</text>
    </g>

    <!-- Mobile -->
    <text x="0" y="404" font-size="22" font-weight="500" fill="#8a8a99">Mobile</text>
    <g transform="translate(0 426)">
      <rect x="0" y="0" width="1200" height="34" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="0" width="1200" height="34" rx="8" fill="#7c7c88" opacity="0.55" />
      <text x="1176" y="24" font-size="18" font-weight="600" fill="#ffffff" text-anchor="end">100%</text>
      <rect x="0" y="44" width="1200" height="34" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="44" width="996" height="34" rx="8" fill="#7c7c88" opacity="0.55" />
      <text x="972" y="68" font-size="18" font-weight="600" fill="#ffffff" text-anchor="end">83%</text>
      <rect x="0" y="88" width="1200" height="34" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="88" width="384" height="34" rx="8" fill="#7c7c88" opacity="0.55" />
      <text x="408" y="112" font-size="18" font-weight="600" fill="#8a8a99">32%</text>
      <rect x="0" y="132" width="1200" height="34" rx="8" fill="#7c7c88" opacity="0.16" />
      <rect x="0" y="132" width="228" height="34" rx="8" fill="#7c7c88" opacity="0.55" />
      <text x="252" y="156" font-size="18" font-weight="600" fill="#8a8a99">19%</text>
    </g>

    <text x="0" y="596" font-size="18" fill="#8a8a99">Step 1 · Step 2 · Step 3 · Step 4</text>
  </g>
</svg>
